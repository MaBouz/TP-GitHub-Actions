name: Java CI with JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # Vérifier l'arborescence
      - name: Check directory
        run: ls -R

      # Installer JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Build Maven (dans le sous-dossier tp1)
      - name: Build project with Maven
        run: mvn clean install -B
        working-directory: tp1

      # Lancer les tests
      - name: Run tests
        run: mvn test -B
        working-directory: tp1

      # Générer le JAR exécutable
      - name: Package JAR
        run: mvn package -B
        working-directory: tp1

      # Lister le contenu du target
      - name: List generated JAR
        run: ls -l tp1/target/

      # Upload du JAR comme artefact
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp1-jar
          path: tp1/target/tp1-1.0-SNAPSHOT.jar
