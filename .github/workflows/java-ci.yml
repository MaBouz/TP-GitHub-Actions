name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest   # exécution dans Linux sur GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build project with Maven
        run: mvn clean install -B

      - name: Run tests
        run: mvn test -B

      - name: Package JAR
        run: mvn package -B

      - name: List generated JAR
        run: ls -l target/
